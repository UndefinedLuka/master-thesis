[project]
name = "thesis-eval"
version = "0.1.0"
description = "Evaluation pipelines for local LLMs on structured-data information retrieval (Spider + BIRD, Direct Context Inference + Text-to-SQL)"
readme = "README.md"
# 3.12+ so frida container Pythons (NGC images) work; local dev uses 3.14 (.python-version).
requires-python = ">=3.12"
dependencies = [
    # serialization formats
    "pyyaml>=6.0.3",
    "dict2xml>=1.7.8",
    "python-toon>=0.1.3",
    # downloads: BIRD (http) + Spider (google drive)
    "httpx>=0.28.1",
    "gdown>=5.2.0",
    # progress
    "tqdm>=4.67.3",
    # default in-process LLM backend (GGUF). Reinstall with the OS build flag,
    # see README. The openai_compat backend needs only httpx (already above).
    "llama-cpp-python>=0.3.20",
]

[project.optional-dependencies]
# Heavy scoring stack (torch/transformers). Installed only for the separate
# `score_results` pass so the generation environment stays lean.
#   uv sync --extra metrics
metrics = [
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "torch>=2.5.0",
    "transformers>=4.46.0",
]
# Plotting and tabular analysis are isolated from benchmark generation dependencies.
#   uv sync --extra visualizations
visualizations = [
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "statsmodels>=0.14.0",
]

[project.scripts]
thesis-download = "cli.download_datasets:main"
thesis-sample-dbs = "cli.build_sampled_dbs:main"
thesis-references = "cli.build_references:main"
thesis-convert = "cli.convert_data:main"
thesis-report-serialization-tokens = "cli.report_serialization_tokens:main"
thesis-benchmark = "cli.run_benchmark:main"
thesis-run-all = "cli.run_all:main"
thesis-score = "cli.score_results:main"
thesis-visualize-all = "visualizations.generate_all:main"

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/cli",
    "src/config",
    "src/datasets",
    "src/llm",
    "src/metrics",
    "src/pipelines",
    "src/prompts",
    "src/reference",
    "src/results",
    "src/serialization",
    "src/sqlite",
    "src/visualizations",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, flake8-bugbear
select = ["F", "E", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "benchmark"
version = "0.1.0"
description = "Serialization & Text-to-SQL information extraction benchmark for local LLMs (thesis ch. 3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "polars>=1.0",
    "pyyaml>=6.0",
    "dict2xml>=1.7",
    "python-toon>=0.1.3",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "gdown>=5.2",
    "requests>=2.32",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.ruff]
line-length = 100
src = ["src"]
